zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: b4ac72ca2a2d49d8aa04209f744bb15a
      name: Templates/Applications
  templates:
    - uuid: c1e2f3a4b5d64c7d8e9f0a1b2c3d4e5f
      template: 'Tasmota by HTTP'
      name: 'Tasmota by HTTP'
      description: |
        Monitors Tasmota-flashed devices (Sonoff, ESP8266, ESP32) through the Tasmota HTTP API using the Zabbix HTTP agent only.

        Five HTTP agent master items fetch the base status documents per polling interval:
        - Status (Status 0): full base status (Status + StatusSTS + all sections)
        - Status.FRM (Status 2): firmware info (StatusFWR)
        - Status.MEM (Status 4): memory/flash info (StatusMEM)
        - Status.NET (Status 5): network info (StatusNET)
        - Status.MQT (Status 6): MQTT info (StatusMQT)

        Scope: status only. Power/energy, light bulb controls, IR data, per-relay state and sensors are not collected.

        Note: Status 0 already returns StatusFWR, StatusMEM, StatusNET and StatusMQT. The separate masters are kept for clarity and are functionally redundant; if you want to reduce HTTP calls, delete them and repoint the dependent items to the Status master.
      wizard_ready: 'YES'
      readme: |
        ## Overview

        This template monitors a [Tasmota](https://tasmota.github.io/docs/) device through its [HTTP API](https://tasmota.github.io/docs/Commands/#http-commands) using the Zabbix HTTP agent.

        Five HTTP agent master items fetch the base status documents per polling interval:

        |Master item|Command|Section|
        |---|---|---|
        |Status|`Status 0`|Status, StatusSTS, and all other sections|
        |Status.FRM|`Status 2`|StatusFWR|
        |Status.MEM|`Status 4`|StatusMEM|
        |Status.NET|`Status 5`|StatusNET|
        |Status.MQT|`Status 6`|StatusMQT|

        ## Scope

        Status only — no power/energy, no light bulb controls, no IR, no relay discovery, no sensor discovery.

        ## Notes on field naming

        In modern Tasmota (13.0 and later):
        - `StatusSTS.Wifi.RSSI` — signal strength as percentage (0–100), mapped to `Status_Wifi_RSSI`
        - `StatusSTS.Wifi.Signal` — signal strength in dBm (negative), mapped to `Status_Wifi_Signal`

        Wi-Fi triggers watch `Status_Wifi_Signal` (dBm).

        If the device does not expose a particular section, the corresponding items simply show "no data" — they do not error (`DISCARD_VALUE`).

        ## Setup

        1. Ensure the Zabbix server or proxy can reach the Tasmota device over HTTP (default port 80).
        2. Create a host, set its interface to the Tasmota IP or DNS name, and link this template.
        3. If the device has a Tasmota `WebPassword` configured, set `{$TASMOTA.USER}` (default `admin`) and `{$TASMOTA.PASS}` on the host.
        4. Optionally change `{$TASMOTA.SCHEME}`, `{$TASMOTA.PORT}` and `{$TASMOTA.STATUS.CMD}`.

        ## Macros used

        |Name|Description|Default|
        |----|-----------|-------|
        |{$TASMOTA.SCHEME}|Request scheme.|`http`|
        |{$TASMOTA.PORT}|HTTP port of the Tasmota web server.|`80`|
        |{$TASMOTA.USER}|Tasmota web username.|`admin`|
        |{$TASMOTA.PASS}|Tasmota web password. Leave empty if not set.|*empty*|
        |{$TASMOTA.STATUS.CMD}|URL-encoded command for the Status master item.|`Status%200`|
        |{$TASMOTA.DATA.INTERVAL}|Polling interval of all master items.|`1m`|
        |{$TASMOTA.TIMEOUT}|HTTP request timeout.|`10s`|
        |{$TASMOTA.NODATA.TIMEOUT}|No-data timeout.|`5m`|
        |{$TASMOTA.RSSI.MIN.WARN}|Wi-Fi RSSI (dBm) warning threshold.|`-80`|
        |{$TASMOTA.RSSI.MIN.CRIT}|Wi-Fi RSSI (dBm) critical threshold.|`-90`|
      vendor:
        name: Community
        version: 8.0-8
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$TASMOTA.SCHEME}'
          value: http
          description: 'Request scheme: http or https.'
          config:
            type: LIST
            priority: '2'
            label: 'Request scheme'
            required: 'YES'
            options:
              - value: http
                text: HTTP
              - value: https
                text: HTTPS
        - macro: '{$TASMOTA.PORT}'
          value: '80'
          description: 'HTTP port of the Tasmota web server.'
          config:
            type: TEXT
            priority: '3'
            label: 'Tasmota port'
            required: 'YES'
            regex: '^[0-9]+$'
        - macro: '{$TASMOTA.USER}'
          value: admin
          description: 'Tasmota web username.'
          config:
            type: TEXT
            priority: '4'
            label: 'Tasmota username'
            required: 'YES'
        - macro: '{$TASMOTA.PASS}'
          value: ''
          type: SECRET_TEXT
          description: 'Tasmota web password. Leave empty if WebPassword is not set on the device.'
        - macro: '{$TASMOTA.STATUS.CMD}'
          value: 'Status%200'
          description: 'URL-encoded Tasmota command for the Status master item.'
          config:
            type: TEXT
            priority: '6'
            label: 'Status command'
            required: 'YES'
        - macro: '{$TASMOTA.DATA.INTERVAL}'
          value: 1m
          description: 'Polling interval of all master items.'
          config:
            type: TEXT
            priority: '7'
            label: 'Polling interval'
            required: 'YES'
        - macro: '{$TASMOTA.TIMEOUT}'
          value: 10s
          description: 'HTTP request timeout.'
          config:
            type: TEXT
            priority: '8'
            label: 'Request timeout'
            required: 'YES'
        - macro: '{$TASMOTA.NODATA.TIMEOUT}'
          value: 5m
          description: 'Time without data after which the device is considered unreachable.'
          config:
            type: TEXT
            priority: '9'
            section_name: Thresholds
            label: 'No data timeout'
        - macro: '{$TASMOTA.RSSI.MIN.WARN}'
          value: '-80'
          description: 'Wi-Fi RSSI warning threshold (dBm).'
          config:
            type: TEXT
            priority: '10'
            section_name: Thresholds
            label: 'Minimum Wi-Fi RSSI (warning), dBm'
            regex: '^-?[0-9]+$'
        - macro: '{$TASMOTA.RSSI.MIN.CRIT}'
          value: '-90'
          description: 'Wi-Fi RSSI critical threshold (dBm).'
          config:
            type: TEXT
            priority: '11'
            section_name: Thresholds
            label: 'Minimum Wi-Fi RSSI (critical), dBm'
            regex: '^-?[0-9]+$'
