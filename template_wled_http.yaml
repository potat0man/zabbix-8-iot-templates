              value: state
        - uuid: f82319752cb541c881fe478f1cff9ca2
          name: 'State'
          type: DEPENDENT
          key: wled.state.on
          description: 'Whether the LED output is switched on.'
          valuemap:
            name: 'WLED On/Off'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.state.on
            - type: BOOL_TO_DECIMAL
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: state
        - uuid: 132afbe58d63409687a90705f85433ea
          name: 'Palette'
          type: DEPENDENT
          key: wled.state.palette
          value_type: CHAR
          description: 'Name of the color palette used on the main segment. Shows the numeric ID if the API path does not return palette names.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value),
                      segs = (d.state && d.state.seg) ? d.state.seg : [],
                      seg = null;

                  for (var i = 0; i < segs.length; i++) {
                      if (segs[i].id === d.state.mainseg) {
                          seg = segs[i];
                          break;
                      }
                  }
                  if (seg === null) {
                      if (segs.length === 0) {
                          return 'None';
                      }
                      seg = segs[0];
                  }

                  var pal = seg.pal,
                      names = d.palettes,
                      info = d.info || {},
                      um = info.umpalnames || [];

                  if (!names) {
                      return 'Palette ' + pal;
                  }
                  if (pal < names.length) {
                      return names[pal];
                  }
                  if (255 - pal < um.length) {
                      return um[255 - pal];
                  }
                  // WLED 16+ numbers custom palettes down from 200, older firmware down from 255.
                  return 'Custom palette ' + ((typeof info.cpalmax === 'number') ? 200 - pal : 255 - pal);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: state
        - uuid: 1def84f7e1a24a349022922c34c8819b
