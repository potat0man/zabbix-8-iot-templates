zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: b4ac72ca2a2d49d8aa04209f744bb15a
      name: Templates/Applications
  templates:
    - uuid: 7505c01db20943eb9e3b62d5c735a1d2
      template: 'WLED by HTTP'
      name: 'WLED by HTTP'
      description: |
        Monitors a WLED LED controller (ESP8266 / ESP32) through its built-in JSON API, using the Zabbix HTTP agent only. No external scripts, no Zabbix agent on the device.

        One request per polling interval fetches the whole device state ('/json'), and every metric is extracted from it with dependent items.

        Setup:
        1. Create a host for the WLED device, set its interface (IP or DNS), and link this template.
        2. The template uses {HOST.CONN} (the host interface address) automatically. No host macro is needed for the address.
        3. Optionally adjust '{$WLED.SCHEME}', '{$WLED.PORT}' and '{$WLED.API.PATH}'.
        4. For power estimation, enable "Automatic Brightness Limiter" in WLED (Config > LED Preferences) and set '{$WLED.LED.VOLTAGE}' to your LED supply voltage.

        Built for the WLED JSON API of WLED 0.14 and later. Fields missing on older firmware are skipped.
      wizard_ready: 'YES'
      readme: |
        ## Overview

        This template monitors a [WLED](https://kno.wled.ge/) LED controller through its [JSON API](https://kno.wled.ge/interfaces/json-api/) using the Zabbix HTTP agent. It works without any external scripts and without a Zabbix agent on the device.

        A single HTTP request per polling interval fetches the full device document (`/json`: state, info, effect names and palette names). All metrics are extracted from that response with dependent items, so the controller is queried only once per interval.

        Collected data:

        - Device: name, firmware version and build, platform, SDK, MAC and IP address, uptime, CPU frequency, flash size
        - Resources: free heap memory, filesystem usage
        - Wi-Fi: RSSI, signal quality, channel, BSSID
        - LEDs: LED count, frame rate, estimated current and power, ABL limit and utilization
        - State: on/off, brightness, preset, playlist, transition, main segment effect and palette, nightlight, UDP sync, realtime (live) mode
        - Segments (low-level discovery): state, brightness, length, effect, palette, primary color

        ## Setup

        1. Make sure the Zabbix server or proxy can reach the WLED device over HTTP (default port 80).
        2. Create a host, set its interface to the WLED device IP or DNS name, and link this template.
           The template uses `{HOST.CONN}` (the host interface address) automatically — no extra host macro is needed for the address.
        3. Optionally change `{$WLED.SCHEME}`, `{$WLED.PORT}` and `{$WLED.API.PATH}`. Use `json/si` on heavily loaded ESP8266 devices to get a smaller response; effect and palette items then show numeric IDs instead of names.
        4. For current and power values, enable the Automatic Brightness Limiter (ABL) in WLED (Config > LED Preferences). Without ABL, WLED reports 0 mA. Set `{$WLED.LED.VOLTAGE}` to the LED supply voltage to get the power estimate in watts.

        ## Macros used

        |Name|Description|Default|
        |----|-----------|-------|
        |{$WLED.SCHEME}|Request scheme: `http` or `https`.|`http`|
        |{$WLED.PORT}|HTTP port of the WLED web server.|`80`|
        |{$WLED.API.PATH}|JSON API path: `json` (full) or `json/si` (state and info only).|`json`|
        |{$WLED.DATA.INTERVAL}|Polling interval of the master item.|`1m`|
        |{$WLED.TIMEOUT}|HTTP request timeout.|`5s`|
        |{$WLED.NODATA.TIMEOUT}|Time without data after which the device is considered unreachable.|`5m`|
        |{$WLED.LED.VOLTAGE}|LED supply voltage, used to estimate power from current.|`5`|
        |{$WLED.MEMORY.FREE.MIN.WARN}|Free heap threshold. WLED becomes unstable below about 10 KB.|`10K`|
        |{$WLED.WIFI.RSSI.MIN.WARN}|Minimum acceptable Wi-Fi RSSI in dBm.|`-80`|
        |{$WLED.FS.PUSED.MAX.WARN}|Maximum filesystem utilization in %.|`90`|
        |{$WLED.ABL.PUSED.MAX.WARN}|LED current as % of the ABL budget at which brightness is considered limited.|`95`|
      vendor:
        name: Community
        version: 8.0-2
      groups:
        - name: Templates/Applications
      items:
        - uuid: fa1fb5f914024b84b24cc6845014b41f
          name: 'Get data'
          type: HTTP_AGENT
          key: wled.get
          delay: '{$WLED.DATA.INTERVAL}'
          history: 1h
          value_type: TEXT
          timeout: '{$WLED.TIMEOUT}'
          description: 'Raw JSON document returned by the WLED JSON API. All other items are dependent on this one.'
          url: '{$WLED.SCHEME}://{HOST.CONN}:{$WLED.PORT}/{$WLED.API.PATH}'
          headers:
            - name: Accept
              value: application/json
          preprocessing:
            - type: CHECK_JSON_ERROR
              parameters:
                - $.error
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 10677e6cd95e462192bf7826476c4d7f
              expression: 'nodata(/WLED by HTTP/wled.get,{$WLED.NODATA.TIMEOUT})=1'
              name: 'WLED: Failed to fetch data from device'
              event_name: 'WLED: Failed to fetch data from device (or no data for {$WLED.NODATA.TIMEOUT})'
              priority: AVERAGE
              description: 'Zabbix has not received data from the WLED JSON API for {$WLED.NODATA.TIMEOUT}. The device may be powered off, disconnected from Wi-Fi, or unreachable from the Zabbix server or proxy.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: d628ce459f294145bd4172749f361a94
          name: 'CPU frequency'
          type: DEPENDENT
          key: wled.cpu.frequency
          units: Hz
          description: 'CPU clock frequency of the microcontroller. Not reported by older firmware.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.clock
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '1000000'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: system
        - uuid: 614af633c8d14769a2ce83b6788035f3
          name: 'Flash size'
          type: DEPENDENT
          key: wled.flash.size
          units: B
          description: 'Size of the flash chip. Not reported by older firmware.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.flash
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '1048576'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: storage
        - uuid: c16a20dd094c4de09aed3632a515cef5
          name: 'Filesystem: Used, in %'
          type: DEPENDENT
          key: wled.fs.pused
          value_type: FLOAT
          units: '%'
          description: 'Filesystem (LittleFS) utilization: configuration, presets, palettes and ledmaps.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.fs
            - type: JAVASCRIPT
              parameters:
                - |
                  var fs = JSON.parse(value);
                  return (fs.t > 0) ? fs.u * 100 / fs.t : 0;
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: dd4db43cdf984bd68df2ae4de0db8001
              expression: 'min(/WLED by HTTP/wled.fs.pused,5m)>{$WLED.FS.PUSED.MAX.WARN}'
              name: 'WLED: Filesystem usage is high'
              event_name: 'WLED: Filesystem usage is high (over {$WLED.FS.PUSED.MAX.WARN}% for 5m)'
              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The WLED filesystem is almost full. Saving presets, palettes or configuration may fail.'
              dependencies:
                - name: 'WLED: Failed to fetch data from device'
                  expression: 'nodata(/WLED by HTTP/wled.get,{$WLED.NODATA.TIMEOUT})=1'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 99a6fba7898248f588afa0d81a91df56
          name: 'Filesystem: Total space'
          type: DEPENDENT
          key: wled.fs.total
          units: B
          description: 'Total size of the filesystem.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.fs.t
            - type: MULTIPLIER
              parameters:
                - '1000'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: storage
        - uuid: 3e297cdd5d214f93bfdd424d0129f6d6
          name: 'Filesystem: Used space'
          type: DEPENDENT
          key: wled.fs.used
          units: B
          description: 'Estimated used space of the filesystem.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.fs.u
            - type: MULTIPLIER
              parameters:
                - '1000'
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: storage
        - uuid: 54c3fa6a191f49deaac12af495c012f9
          name: 'Platform'
          type: DEPENDENT
          key: wled.info.arch
          value_type: CHAR
          description: 'Microcontroller platform, for example esp8266, esp32, ESP32-S3, ESP32-C3.'
          inventory_link: HARDWARE
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.arch
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: system
        - uuid: e687196656ba44f48e4e1692822e894c
          name: 'Firmware build'
          type: DEPENDENT
          key: wled.info.build
          description: 'Firmware build ID in YYMMDDB format.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.vid
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: system
        - uuid: 6e97b3ae3ac54fb298964962b798b7c3
          name: 'SDK version'
          type: DEPENDENT
          key: wled.info.core
          value_type: CHAR
          description: 'Version of the Arduino core / ESP-IDF SDK the firmware was built with.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.core
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: system
        - uuid: b554a40e534746bb83f3c6c5e11b18dc
          name: 'IP address'
          type: DEPENDENT
          key: wled.info.ip
          value_type: CHAR
          description: 'IP address of the device. Empty if not connected.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.ip
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: network
        - uuid: 1f1c3912f9084be598394bc215f4bc24
          name: 'MAC address'
          type: DEPENDENT
          key: wled.info.mac
          value_type: CHAR
          description: 'MAC address of the Wi-Fi interface.'
          inventory_link: MACADDRESS_A
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.mac
            - type: JAVASCRIPT
              parameters:
                - |
                  var parts = String(value).match(/.{1,2}/g);
                  return parts ? parts.join(':') : value;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: network
        - uuid: d25d13b0fced42ec85ae28577c5f8a0e
          name: 'Device name'
          type: DEPENDENT
          key: wled.info.name
          value_type: CHAR
          description: 'Friendly name configured in WLED (Config > User Interface).'
          inventory_link: NAME
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.name
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: system
        - uuid: 0482ec5a7f1a48eeb9c6e9d94f889c3f
          name: 'Firmware version'
          type: DEPENDENT
          key: wled.info.version
          value_type: CHAR
          description: 'WLED firmware version.'
          inventory_link: SOFTWARE
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.ver
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 952e85edd0174b8eb8a2800243e1dff0
              expression: 'last(/WLED by HTTP/wled.info.version,#1)<>last(/WLED by HTTP/wled.info.version,#2) and length(last(/WLED by HTTP/wled.info.version))>0'
              name: 'WLED: Firmware version has changed'
              event_name: 'WLED: Firmware version has changed (new version: {ITEM.VALUE})'
              priority: INFO
              description: 'The WLED firmware version has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: e554fd9d58ca4bd9ac6b3e3e244b99e6
          name: 'LEDs: Current'
          type: DEPENDENT
          key: wled.leds.current
          value_type: FLOAT
          units: A
          description: 'Estimated current drawn by the LEDs. WLED reports 0 if the Automatic Brightness Limiter (ABL) is disabled.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.leds.pwr
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: leds
            - tag: component
              value: power
        - uuid: 9dc6f0dd23f941dab3871bd7d2d65406
          name: 'LEDs: Current limit'
          type: DEPENDENT
          key: wled.leds.current.max
          value_type: FLOAT
          units: A
          description: 'Current budget configured in the Automatic Brightness Limiter (ABL). 0 if ABL is disabled.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.leds.maxpwr
            - type: MULTIPLIER
              parameters:
                - '0.001'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: leds
            - tag: component
              value: power
        - uuid: f012b49d3bd14ae1b746d229d9360a90
          name: 'LEDs: Current, in % of limit'
          type: DEPENDENT
          key: wled.leds.current.pused
          value_type: FLOAT
          units: '%'
          description: 'Estimated LED current as a percentage of the ABL budget. At about 100% WLED reduces brightness to stay within the budget. 0 if ABL is disabled.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.leds
            - type: JAVASCRIPT
              parameters:
                - |
                  var leds = JSON.parse(value);
                  return (leds.maxpwr > 0) ? leds.pwr * 100 / leds.maxpwr : 0;
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: leds
            - tag: component
              value: power
          triggers:
            - uuid: 8ac339806adc4ec188a7bcb6132893ed
              expression: 'min(/WLED by HTTP/wled.leds.current.pused,5m)>={$WLED.ABL.PUSED.MAX.WARN}'
              name: 'WLED: Brightness is being limited by ABL'
              event_name: 'WLED: Brightness is being limited by ABL (current at {$WLED.ABL.PUSED.MAX.WARN}% or more of the budget for 5m)'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'The estimated LED current has stayed at the Automatic Brightness Limiter budget, so WLED is dimming the output. Consider a larger power supply budget or lower brightness.'
              dependencies:
                - name: 'WLED: Failed to fetch data from device'
                  expression: 'nodata(/WLED by HTTP/wled.get,{$WLED.NODATA.TIMEOUT})=1'
              tags:
                - tag: scope
                  value: capacity
        - uuid: cea6b9cf3f034835a89556a25b1a25c0
          name: 'LEDs: Count'
          type: DEPENDENT
          key: wled.leds.count
          description: 'Total number of configured LEDs.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.leds.count
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: leds
        - uuid: 95e181d16fd24aada004fed8a24495fe
          name: 'LEDs: Frame rate'
          type: DEPENDENT
          key: wled.leds.fps
          units: fps
          description: 'Current number of frames per second rendered to the LEDs.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.leds.fps
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: leds
        - uuid: a899347f4ad74b8b9a174a5445a25d7c
          name: 'LEDs: Power'
          type: DEPENDENT
          key: wled.leds.power
          value_type: FLOAT
          units: W
          description: 'Estimated LED power: reported current multiplied by {$WLED.LED.VOLTAGE}. 0 if ABL is disabled.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.leds.pwr
            - type: JAVASCRIPT
              parameters:
                - 'return parseFloat(value) * parseFloat(''{$WLED.LED.VOLTAGE}'') / 1000;'
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: leds
            - tag: component
              value: power
        - uuid: 4774c8cb9be74b048deb032a8455e635
          name: 'Realtime mode'
          type: DEPENDENT
          key: wled.live
          description: 'Whether the device is currently receiving realtime data (E1.31, Art-Net, DDP, UDP, Hyperion, Adalight).'
          valuemap:
            name: 'WLED Yes/No'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.live
            - type: BOOL_TO_DECIMAL
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: state
        - uuid: b47d28b84c6343848d8eccc8f9d78076
          name: 'Realtime source'
          type: DEPENDENT
          key: wled.live.source
          value_type: CHAR
          description: 'Protocol and IP address of the realtime data source, or "None".'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info
            - type: JAVASCRIPT
              parameters:
                - |
                  var info = JSON.parse(value);
                  if (!info.live) {
                      return 'None';
                  }
                  var src = info.lm ? info.lm : 'Generic';
                  return info.lip ? src + ' from ' + info.lip : src;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: state
        - uuid: 6a1eecfbf91047b2be0a4009206613b1
          name: 'Memory: Free heap'
          type: DEPENDENT
          key: wled.memory.free
          units: B
          description: 'Free heap RAM. WLED may become unstable below about 10 KB.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.freeheap
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 0cffb638addf44ed8ac63885fc035f56
              expression: 'max(/WLED by HTTP/wled.memory.free,5m)<{$WLED.MEMORY.FREE.MIN.WARN}'
              name: 'WLED: Free heap memory is low'
              event_name: 'WLED: Free heap memory is low (below {$WLED.MEMORY.FREE.MIN.WARN} for 5m)'
              opdata: 'Free: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Low free heap on WLED often leads to unresponsive UI, failed requests and crashes. Reduce LED count, segments, usermods or WebSocket clients.'
              dependencies:
                - name: 'WLED: Failed to fetch data from device'
                  expression: 'nodata(/WLED by HTTP/wled.get,{$WLED.NODATA.TIMEOUT})=1'
              tags:
                - tag: scope
                  value: performance
        - uuid: fcc52c6c5f124956865db7b2749c2fd4
          name: 'Nightlight: Mode'
          type: DEPENDENT
          key: wled.nightlight.mode
          description: 'Configured nightlight mode.'
          valuemap:
            name: 'WLED Nightlight mode'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.state.nl.mode
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: nightlight
        - uuid: af9c6ee8b6934cde9b78b7c4acb13ab8
          name: 'Nightlight: Active'
          type: DEPENDENT
          key: wled.nightlight.on
          description: 'Whether the nightlight timer is active.'
          valuemap:
            name: 'WLED Yes/No'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.state.nl.on
            - type: BOOL_TO_DECIMAL
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: nightlight
        - uuid: e7cfc09bb2524f5a9f6ea4d960eb5066
          name: 'Nightlight: Time remaining'
          type: DEPENDENT
          key: wled.nightlight.remaining
          value_type: FLOAT
          units: s
          description: 'Remaining nightlight time. -1 if the nightlight is not active.'
          valuemap:
            name: 'WLED Nightlight remaining'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.state.nl.rem
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: nightlight
        - uuid: 4089f1ac608841b18ca203d35013309d
          name: 'Discovered WLED nodes'
          type: DEPENDENT
          key: wled.nodes.discovered
          value_type: FLOAT
          description: 'Number of other WLED devices discovered on the network. -1 if node discovery is disabled.'
          valuemap:
            name: 'WLED Node discovery'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info.ndc
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: network
        - uuid: 355fd65fe91a4ddea0f72e9dcfab8ff8
          name: 'Brightness'
          type: DEPENDENT
          key: wled.state.brightness
          description: 'Master brightness, 1-255. When the light is off, the last brightness is reported.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.state.bri
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: state
        - uuid: 2df363fd6083471fbedd3e003162393a
          name: 'Effect'
          type: DEPENDENT
          key: wled.state.effect
          value_type: CHAR
          description: 'Name of the effect running on the main segment. Shows the numeric ID if the API path does not return effect names.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value),
                      segs = (d.state && d.state.seg) ? d.state.seg : [],
                      seg = null;

                  for (var i = 0; i < segs.length; i++) {
                      if (segs[i].id === d.state.mainseg) {
                          seg = segs[i];
                          break;
                      }
                  }
                  if (seg === null) {
                      if (segs.length === 0) {
                          return 'None';
                      }
                      seg = segs[0];
                  }

                  var names = d.effects;
                  return (names && seg.fx < names.length) ? names[seg.fx] : 'Effect ' + seg.fx;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: wled.get
          tags:
            - tag: component
              value: state
        - uuid: 537e1f49ade94b62b9c0ff32bd56fdfd
          name: 'Live data override'
          type: DEPENDENT
