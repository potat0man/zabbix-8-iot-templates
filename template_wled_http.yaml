      discovery_rules:
        - uuid: f888bd916f0643ee805afc591c2b2110
          name: 'Segment discovery'
          type: DEPENDENT
          key: wled.segment.discovery
          lifetime: 1d
          description: 'Discovers active WLED segments.'
          item_prototypes:
            - uuid: f655ab95e33541608c1b8811e58a535e
              name: 'Segment [{#SEG.NAME}]: Brightness'
              type: DEPENDENT
              key: 'wled.segment.brightness[{#SEG.ID}]'
              description: 'Segment brightness (opacity), 0-255.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.state.seg[?(@.id=={#SEG.ID})].bri.first()'
              master_item:
                key: wled.get
              tags:
                - tag: component
                  value: segment
                - tag: segment
                  value: '{#SEG.NAME}'
            - uuid: 088f00a0ed6b448cb058fa2a4a8fe3d4
              name: 'Segment [{#SEG.NAME}]: Primary color'
              type: DEPENDENT
              key: 'wled.segment.color[{#SEG.ID}]'
              value_type: CHAR
              description: 'Primary color of the segment as #RRGGBB, or #RRGGBBWW for RGBW LEDs.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.state.seg[?(@.id=={#SEG.ID})].col.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var col = JSON.parse(value),
                          c = (col && col.length) ? col[0] : null;

                      if (typeof c === 'string') {
                          return '#' + c.toUpperCase();
                      }
                      if (!c || !c.length) {
                          return 'None';
                      }

                      var hex = '#';
                      for (var i = 0; i < c.length; i++) {
                          hex += ('0' + (c[i] & 255).toString(16)).slice(-2);
                      }
                      return hex.toUpperCase();
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: wled.get
              tags:
                - tag: component
                  value: segment
                - tag: segment
                  value: '{#SEG.NAME}'
            - uuid: d1b8d47c74644dd88afe8b2fa086cbc4
              name: 'Segment [{#SEG.NAME}]: Effect'
              type: DEPENDENT
              key: 'wled.segment.effect[{#SEG.ID}]'
              value_type: CHAR
              description: 'Name of the effect running on the segment.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value),
                          segs = (d.state && d.state.seg) ? d.state.seg : [],
                          seg = null;

                      for (var i = 0; i < segs.length; i++) {
                          if (String(segs[i].id) === '{#SEG.ID}') {
                              seg = segs[i];
                              break;
                          }
                      }
                      if (seg === null) {
                          throw 'Segment {#SEG.ID} not found.';
                      }

                      var names = d.effects;
                      return (names && seg.fx < names.length) ? names[seg.fx] : 'Effect ' + seg.fx;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: wled.get
              tags:
                - tag: component
                  value: segment
                - tag: segment
                  value: '{#SEG.NAME}'
            - uuid: 0a4f40db40924ee78b5babdab1e9c902
              name: 'Segment [{#SEG.NAME}]: Length'
              type: DEPENDENT
              key: 'wled.segment.leds[{#SEG.ID}]'
              description: 'Number of LEDs in the segment (columns for 2D segments).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.state.seg[?(@.id=={#SEG.ID})].len.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: wled.get
              tags:
                - tag: component
                  value: segment
                - tag: segment
                  value: '{#SEG.NAME}'
            - uuid: b73458205a254c289169e43be7757d28
              name: 'Segment [{#SEG.NAME}]: State'
              type: DEPENDENT
              key: 'wled.segment.on[{#SEG.ID}]'
              description: 'Whether the segment is switched on.'
              valuemap:
                name: 'WLED On/Off'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.state.seg[?(@.id=={#SEG.ID})].on.first()'
                - type: BOOL_TO_DECIMAL
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: wled.get
              tags:
                - tag: component
                  value: segment
                - tag: segment
                  value: '{#SEG.NAME}'
            - uuid: 7f851d3ebd5d4899ad09eae372dfdb9d
              name: 'Segment [{#SEG.NAME}]: Palette'
              type: DEPENDENT
              key: 'wled.segment.palette[{#SEG.ID}]'
              value_type: CHAR
              description: 'Name of the color palette used by the segment.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value),
                          segs = (d.state && d.state.seg) ? d.state.seg : [],
                          seg = null;

                      for (var i = 0; i < segs.length; i++) {
                          if (String(segs[i].id) === '{#SEG.ID}') {
                              seg = segs[i];
                              break;
                          }
                      }
                      if (seg === null) {
                          throw 'Segment {#SEG.ID} not found.';
                      }

                      var pal = seg.pal,
                          names = d.palettes,
                          info = d.info || {},
                          um = info.umpalnames || [];

                      if (!names) {
                          return 'Palette ' + pal;
                      }
                      if (pal < names.length) {
                          return names[pal];
                      }
                      if (255 - pal < um.length) {
                          return um[255 - pal];
                      }
                      // WLED 16+ numbers custom palettes down from 200, older firmware down from 255.
                      return 'Custom palette ' + ((typeof info.cpalmax === 'number') ? 200 - pal : 255 - pal);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: wled.get
              tags:
                - tag: component
                  value: segment
                - tag: segment
                  value: '{#SEG.NAME}'
          master_item:
            key: wled.get
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value),
                      segs = (d.state && d.state.seg) ? d.state.seg : [],
                      out = [];

                  for (var i = 0; i < segs.length; i++) {
                      var id = (typeof segs[i].id === 'number') ? segs[i].id : i;
                      out.push({
                          '{#SEG.ID}': String(id),
                          '{#SEG.NAME}': (typeof segs[i].n === 'string' && segs[i].n.length > 0) ? segs[i].n : 'Segment ' + id
                      });
                  }

                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: hardware
        - tag: target
          value: wled
      macros:
        - macro: '{$WLED.ABL.PUSED.MAX.WARN}'
          value: '95'
          description: 'LED current, in % of the ABL budget, at which brightness is considered limited.'
          config:
            type: TEXT
            priority: '12'
            section_name: Thresholds
            label: 'ABL utilization threshold, %'
            description: 'LED current as a percentage of the Automatic Brightness Limiter budget. From 0 to 100.'
            regex: '^([0-9]+|[0-9]+\.[0-9]+)$'
        - macro: '{$WLED.API.PATH}'
          value: json
          description: 'JSON API path. "json" returns state, info, effect and palette names; "json/si" returns state and info only (smaller response, no effect or palette names).'
          config:
            type: LIST
            priority: '4'
            label: 'JSON API path'
            description: 'Use "json/si" for a lighter request on busy ESP8266 devices. Effect and palette items will then show numeric IDs.'
            required: 'YES'
            options:
              - value: json
                text: 'Full (/json)'
              - value: json/si
                text: 'State and info only (/json/si)'
        - macro: '{$WLED.DATA.INTERVAL}'
          value: 1m
          description: 'Polling interval of the "Get data" master item.'
          config:
            type: TEXT
            priority: '5'
            label: 'Polling interval'
            description: 'Time suffixes are supported, for example 30s or 1m.'
            required: 'YES'
        - macro: '{$WLED.FS.PUSED.MAX.WARN}'
          value: '90'
          description: 'Maximum filesystem utilization, in %.'
          config:
            type: TEXT
            priority: '11'
            section_name: Thresholds
            label: 'Maximum filesystem utilization, %'
            description: 'From 0 to 100.'
            regex: '^([0-9]+|[0-9]+\.[0-9]+)$'
        - macro: '{$WLED.LED.VOLTAGE}'
          value: '5'
          description: 'LED supply voltage in volts. Used to estimate LED power from the reported current.'
          config:
            type: TEXT
            priority: '7'
            label: 'LED supply voltage, V'
            description: 'Typically 5, 12 or 24.'
            required: 'YES'
            regex: '^([0-9]+|[0-9]+\.[0-9]+)$'
        - macro: '{$WLED.MEMORY.FREE.MIN.WARN}'
          value: 10K
          description: 'Minimum free heap memory. WLED may become unstable below about 10 KB.'
          config:
            type: TEXT
            priority: '9'
            section_name: Thresholds
            label: 'Minimum free heap'
            description: 'In bytes. Size suffixes K and M are supported, for example 10K.'
            regex: '^[0-9]+[KMG]?$'
        - macro: '{$WLED.NODATA.TIMEOUT}'
          value: 5m
          description: 'Time without data after which the device is considered unreachable.'
          config:
            type: TEXT
            priority: '8'
            section_name: Thresholds
            label: 'No data timeout'
            description: 'Time suffixes are supported, for example 5m or 1h.'
        - macro: '{$WLED.PORT}'
          value: '80'
          description: 'HTTP port of the WLED web server.'
          config:
            type: TEXT
            priority: '3'
            label: 'WLED port'
            description: 'In the range from 1 to 65535 inclusive.'
            required: 'YES'
            regex: '^[0-9]+$'
        - macro: '{$WLED.SCHEME}'
          value: http
          description: 'Request scheme: http or https.'
          config:
            type: LIST
            priority: '2'
            label: 'Request scheme'
            description: 'WLED serves plain HTTP. Use HTTPS only behind a TLS reverse proxy.'
            required: 'YES'
            options:
              - value: http
                text: HTTP
              - value: https
                text: HTTPS
        - macro: '{$WLED.TIMEOUT}'
          value: 5s
          description: 'HTTP request timeout.'
          config:
            type: TEXT
            priority: '6'
            label: 'Request timeout'
            description: 'From 1s to 600s.'
            required: 'YES'
        - macro: '{$WLED.WIFI.RSSI.MIN.WARN}'
          value: '-80'
          description: 'Minimum acceptable Wi-Fi RSSI, in dBm.'
          config:
            type: TEXT
            priority: '10'
            section_name: Thresholds
            label: 'Minimum Wi-Fi RSSI, dBm'
            description: 'A negative number, for example -80.'
            regex: '^-?[0-9]+$'
