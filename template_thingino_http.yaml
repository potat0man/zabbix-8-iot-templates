  triggers:
    - uuid: a0054c7f4fde4c6dbe2ed291fb8c127c
      expression: 'last(/Thingino camera by HTTP/thingino.recording.autostart)=1 and last(/Thingino camera by HTTP/thingino.storage.mounted)=0'
      name: 'Thingino: Recording is enabled, but storage is not mounted'
      priority: AVERAGE
      description: 'Continuous recording is configured, but the recording storage (see the "Storage: Mount point" item) is not mounted. Check the SD card or the network share.'
      manual_close: 'YES'
      dependencies:
        - name: 'Thingino: Camera is unreachable'
          expression: 'max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=0'
      tags:
        - tag: scope
          value: availability
    - uuid: 25d69738870645fcacfcc9e76548727b
      expression: 'last(/Thingino camera by HTTP/thingino.recording.autostart)=1 and last(/Thingino camera by HTTP/thingino.storage.mounted)=1 and last(/Thingino camera by HTTP/thingino.storage.writable)=0'
      name: 'Thingino: Recording storage is not writable'
      priority: AVERAGE
      description: 'The recording storage is mounted read-only or is not writable. The filesystem may be corrupted.'
      manual_close: 'YES'
      dependencies:
        - name: 'Thingino: Camera is unreachable'
          expression: 'max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=0'
      tags:
        - tag: scope
          value: availability
    - uuid: 01cc720000004d56b499d929d6d520c1
      expression: 'last(/Thingino camera by HTTP/thingino.recording.autostart)=1 and max(/Thingino camera by HTTP/thingino.recording.active,{$THINGINO.RECORDING.INACTIVE.PERIOD})=0'
      name: 'Thingino: Continuous recording is not running'
      event_name: 'Thingino: Continuous recording is not running (for {$THINGINO.RECORDING.INACTIVE.PERIOD})'
      priority: WARNING
      description: 'Recording autostart is enabled, but no recording has been active for {$THINGINO.RECORDING.INACTIVE.PERIOD}.'
      manual_close: 'YES'
      dependencies:
        - name: 'Thingino: Camera is unreachable'
          expression: 'max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=0'
        - name: 'Thingino: Streamer is not running'
          expression: 'max(/Thingino camera by HTTP/thingino.streamer.running,{$THINGINO.STREAMER.DOWN.PERIOD})=0'
        - name: 'Thingino: Recording is enabled, but storage is not mounted'
          expression: 'last(/Thingino camera by HTTP/thingino.recording.autostart)=1 and last(/Thingino camera by HTTP/thingino.storage.mounted)=0'
        - name: 'Thingino: Recording storage is not writable'
          expression: 'last(/Thingino camera by HTTP/thingino.recording.autostart)=1 and last(/Thingino camera by HTTP/thingino.storage.mounted)=1 and last(/Thingino camera by HTTP/thingino.storage.writable)=0'
      tags:
        - tag: scope
          value: availability
