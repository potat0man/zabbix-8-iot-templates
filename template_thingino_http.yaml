          name: 'Recording: Autostart'
          type: DEPENDENT
          key: thingino.recording.autostart
          description: 'Continuous recording is configured to start automatically.'
          valuemap:
            name: 'Thingino yes/no'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.recording.configured_autostart
              error_handler: DISCARD_VALUE
            - type: BOOL_TO_DECIMAL
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
