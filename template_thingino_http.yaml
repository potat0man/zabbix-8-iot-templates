zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 192a8b7cd9c1428982e933183e7777ea
      name: 'Templates/Video surveillance'
  templates:
    - uuid: 986b361631b34a968e6237230d84d90c
      template: 'Thingino camera by HTTP'
      name: 'Thingino camera by HTTP'
      description: |-
        Monitors cameras running the Thingino open-source firmware (https://thingino.com) with the Zabbix HTTP agent only:
        no external scripts, no Zabbix agent on the camera.

        Data comes from the camera web interface: /x/json-heartbeat-slow.cgi, /x/json-system-usage.cgi,
        /x/json-sensor-info.cgi, /x/info.cgi (status, top, release), /x/json-prudynt.cgi (streams, motion; read-only)
        and the Thingino camera agent API (/x/agent.cgi -> /api/v1/runtime and /api/v1/device). Every metric has one
        item and one source: the one available on the widest range of firmware. Stream discovery needs the prudynt
        streamer; with raptor or timps the other items still work.

        Requirements: Thingino firmware with API keys (2026 builds). Stream health, storage mount state, recording
        autostart, motion detected, network, hostname and camera ID come from the camera agent (/x/agent.cgi).
        Firmware without the 2026-08-16 agent.cgi fix - including the "ciao" release branch - needs a one-line patch
        on the camera for those items; see the trigger on the "API: Status" item.

        Setup:
        1. On the camera open Settings > Web Interface > API Access and generate an API key
           (or add the Zabbix server/proxy IP to "Trusted IPs (skip login)" on that page).
        2. Create a host with an interface (e.g. Agent) set to the camera IP or DNS name, link this template
           and set {$THINGINO.API.KEY}. The camera address is taken from the host interface ({HOST.CONN}).
        3. The defaults are https/443 (Thingino's uhttpd build). For a plain-HTTP web server (e.g. BusyBox httpd
           without TLS) set {$THINGINO.SCHEME}=http and {$THINGINO.PORT}=80. Self-signed certificates are accepted.
      wizard_ready: 'YES'
      readme: |-
        ## Overview

        Monitors cameras running the [Thingino](https://thingino.com) open-source firmware with the Zabbix HTTP agent.
        No external scripts are needed and nothing has to be installed on the camera.

        Collected data: availability and API authentication, uptime, clock drift, load, memory, overlay (flash) usage,
        streamer state, per-stream health and settings (RTSP listener, codec, resolution, frame rate, bitrate),
        SD card / recording storage, continuous recording, day/night mode, ambient brightness and gain, IR-cut filter,
        IR and white LEDs, microphone/speaker, motion detection, privacy mode, WireGuard, firmware version and
        inventory data (model, SoC, MAC, hostname).

        Endpoints used (all on the camera web interface):

        - `/x/json-heartbeat-slow.cgi` - uptime, clock, day/night, recording, privacy, lights, audio
        - `/x/json-system-usage.cgi` - memory and overlay usage
        - `/x/info.cgi?name=status` - load average and mounted filesystems (`uptime`, `df -T`)
        - `/x/info.cgi?name=top` - process list (is the streamer running)
        - `/x/info.cgi?name=release` - firmware build and profile (`/etc/os-release`)
        - `/x/json-sensor-info.cgi` - sensor and SoC model
        - `/x/json-prudynt.cgi` - stream settings, live stream statistics, recorder state, motion detection (read-only query)
        - `/x/agent.cgi?agent_path=/api/v1/runtime` - stream health, storage mount state, recording autostart, motion
          detected, network
        - `/x/agent.cgi?agent_path=/api/v1/device` - hostname and camera ID

        Every metric has exactly one item, read from the source that is available on the widest range of firmware.

        ## Requirements

        Thingino firmware with API key support (2026 builds). Stream discovery needs the prudynt streamer (the
        default); with raptor or timps all other items still work.

        Firmware without the 2026-08-16 fix (Thingino master before that date, and the `ciao` release branch,
        e.g. `firmware-2026-11-05`) has a bug in `/x/agent.cgi` ("Carriage return found in header" in Zabbix).
        On such firmware only the agent-based items listed above stay empty and the "API: Status" item shows
        "agent.cgi header bug: patch camera". Patch the camera over SSH (stored in the overlay, survives reboots):

        ```
        sed -i 's|text="Bad Gateway"; printf|text="Bad Gateway"; sub(/\\r$/, "", text); printf|' /var/www/x/agent.cgi
        ```

        After installing a firmware that contains the fix, restore the stock file:
        `cp /rom/var/www/x/agent.cgi /var/www/x/agent.cgi`.

        ## Setup

        1. On the camera open *Settings > Web Interface > API Access* and click *Generate New Key*.
           Alternatively, add the Zabbix server or proxy IP address to "Trusted IPs (skip login)" on the same page.
        2. Create a host, set its interface (for example *Agent*) to the camera IP or DNS name and link this template.
           The camera address is taken from the host interface (`{HOST.CONN}`). Put the key into the `API key` field
           (`{$THINGINO.API.KEY}`).
        3. The defaults (`https`, port `443`) match Thingino's default uhttpd web server. For a camera with a plain
           HTTP web server (for example BusyBox httpd without TLS) choose `HTTP` and port `80`.
           Certificates are not verified, so the camera's self-signed certificate works.
      groups:
        - name: 'Templates/Video surveillance'
      items:
        - uuid: b56746d845d946daa1b8599df37fc828
          name: 'Get runtime data'
          type: HTTP_AGENT
          key: thingino.runtime.get
          delay: '{$THINGINO.INTERVAL}'
          history: '0'
          value_type: TEXT
          description: |-
            Runtime state of the camera from the Thingino camera agent (`/api/v1/runtime`, proxied by the web UI endpoint `/x/agent.cgi`): stream health and RTSP listener, storage mount state, recording autostart, motion detected, network, day/night target mode and pending firmware upgrades.
            Any HTTP status is accepted so that error bodies (e.g. 401) can be classified by the "API: Status" item; transport errors are turned into a "ZBX_ERROR: <message>" value instead of making the item unsupported.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '0'
                - .+
              error_handler: CUSTOM_VALUE
              error_handler_params: 'ZBX_ERROR: \0'
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: 'ZBX_ERROR: Unknown error'
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/agent.cgi'
          query_fields:
            - name: agent_path
              value: /api/v1/runtime
          status_codes: 200-599
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: 759899455b8c4975ad889b11ea172e89
          name: 'Get heartbeat data'
          type: HTTP_AGENT
          key: thingino.heartbeat.get
          delay: '{$THINGINO.INTERVAL}'
          history: '0'
          value_type: TEXT
          description: 'One-shot heartbeat used by the Thingino web UI: camera clock, day/night photosensing, colour mode, IR-cut filter, IR/white LEDs, audio and WireGuard state.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/json-heartbeat-slow.cgi'
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: 186df42c88594e17aab8df06e07f104c
          name: 'Get system usage'
          type: HTTP_AGENT
          key: thingino.usage.get
          delay: '{$THINGINO.INTERVAL}'
          history: '0'
          value_type: TEXT
          description: 'Memory and overlay (writable flash partition) usage from `/x/json-system-usage.cgi`.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/json-system-usage.cgi'
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: 3fadde39fd404d39a7955c605a8e0d8e
          name: 'Get system status'
          type: HTTP_AGENT
          key: thingino.status.get
          delay: '{$THINGINO.INTERVAL}'
          history: '0'
          value_type: TEXT
          description: 'Output of `uptime` and `df -T` from the web UI info page (`/x/info.cgi?name=status`), parsed into JSON: load averages and mounted filesystems. Does not depend on the camera agent.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  function b64text(b64) {
                      var buf = atob(b64 || ''), out = '';
                      if (typeof buf === 'string') {
                          return buf;
                      }
                      for (var i = 0; i < buf.length; i++) {
                          out += String.fromCharCode(buf[i]);
                      }
                      return out;
                  }
                  var data = JSON.parse(value);
                  var cmds = data.commands || [];
                  var out = {load: null, filesystems: []};
                  for (var i = 0; i < cmds.length; i++) {
                      var cmd = String(cmds[i].command);
                      var body = b64text(cmds[i].output_base64);
                      if (cmd === 'uptime') {
                          var m = body.match(/load average:\s*([0-9.]+),?\s+([0-9.]+),?\s+([0-9.]+)/);
                          if (m) {
                              out.load = {avg1: parseFloat(m[1]), avg5: parseFloat(m[2]), avg15: parseFloat(m[3])};
                          }
                      }
                      else if (/^df\b/.test(cmd)) {
                          // BusyBox df prints devices longer than 20 characters on a line of their own.
                          var lines = body.split('\n');
                          var pending = null;
                          for (var j = 1; j < lines.length; j++) {
                              var f = lines[j].replace(/^\s+|\s+$/g, '').split(/\s+/);
                              if (f.length === 1 && f[0] !== '') {
                                  pending = f[0];
                                  continue;
                              }
                              if (pending !== null && f.length === 6) {
                                  f.unshift(pending);
                              }
                              pending = null;
                              if (f.length < 7 || !/^[0-9]+$/.test(f[2]) || !/^[0-9]+$/.test(f[3]) || !/^[0-9]+$/.test(f[4])) {
                                  continue;
                              }
                              out.filesystems.push({
                                  device: f[0],
                                  type: f[1],
                                  mount: f.slice(6).join(' '),
                                  total: parseInt(f[2], 10) * 1024,
                                  used: parseInt(f[3], 10) * 1024,
                                  free: parseInt(f[4], 10) * 1024
                              });
                          }
                      }
                  }
                  return JSON.stringify(out);
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/info.cgi'
          query_fields:
            - name: name
              value: status
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: 9a3b50464b074eda8dab8135f88c7aa5
          name: 'Get process list'
          type: HTTP_AGENT
          key: thingino.processes.get
          delay: '{$THINGINO.INTERVAL}'
          history: '0'
          value_type: TEXT
          description: 'Output of `top -n 1 -b` from the web UI info page (`/x/info.cgi?name=top`), parsed into JSON: number of processes and whether a streamer daemon (prudynt, rvd/raptor, timpsd/timps) is running.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  function b64text(b64) {
                      var buf = atob(b64 || ''), out = '';
                      if (typeof buf === 'string') {
                          return buf;
                      }
                      for (var i = 0; i < buf.length; i++) {
                          out += String.fromCharCode(buf[i]);
                      }
                      return out;
                  }
                  var data = JSON.parse(value);
                  var cmds = data.commands || [];
                  var body = null;
                  for (var i = 0; i < cmds.length; i++) {
                      if (/^top\b/.test(String(cmds[i].command))) {
                          body = b64text(cmds[i].output_base64);
                      }
                  }
                  if (body === null) {
                      throw 'No top output in the response.';
                  }
                  // Streamer daemons: prudynt (prudynt-t), rvd (raptor), timpsd (timps).
                  var names = {prudynt: 'prudynt', rvd: 'raptor', timpsd: 'timps'};
                  var out = {processes: 0, streamer_running: 0, streamer: null};
                  var lines = body.split('\n');
                  var header = false;
                  for (var j = 0; j < lines.length; j++) {
                      if (!header) {
                          header = /\bPID\b.*\bCOMMAND\b/.test(lines[j]);
                          continue;
                      }
                      if (!/^\s*[0-9]+\s/.test(lines[j])) {
                          continue;
                      }
                      out.processes++;
                      var m = lines[j].match(/(?:^|\s)(?:\S*\/)?(prudynt|rvd|timpsd)(?:\s|$)/);
                      if (m) {
                          out.streamer_running = 1;
                          out.streamer = names[m[1]];
                      }
                  }
                  if (!header) {
                      throw 'Unexpected top output.';
                  }
                  return JSON.stringify(out);
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/info.cgi'
          query_fields:
            - name: name
              value: top
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: d0fd1ec3958a44ec8541bb7ea0ee917a
          name: 'Get firmware release'
          type: HTTP_AGENT
          key: thingino.release.get
          delay: 1h
          history: '0'
          value_type: TEXT
          description: 'Contents of /etc/os-release from the web UI info page (`/x/info.cgi?name=release`), parsed into JSON.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  function b64text(b64) {
                      var buf = atob(b64 || ''), out = '';
                      if (typeof buf === 'string') {
                          return buf;
                      }
                      for (var i = 0; i < buf.length; i++) {
                          out += String.fromCharCode(buf[i]);
                      }
                      return out;
                  }
                  var data = JSON.parse(value);
                  var cmds = data.commands || [];
                  var out = {};
                  for (var i = 0; i < cmds.length; i++) {
                      if (!/os-release/.test(String(cmds[i].command))) {
                          continue;
                      }
                      var lines = b64text(cmds[i].output_base64).split('\n');
                      for (var j = 0; j < lines.length; j++) {
                          var m = lines[j].match(/^([A-Z0-9_]+)=(.*)$/);
                          if (m) {
                              var v = m[2].replace(/^\s+|\s+$/g, '');
                              if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') {
                                  v = v.substring(1, v.length - 1);
                              }
                              out[m[1]] = v;
                          }
                      }
                  }
                  if (!out.ID) {
                      throw 'Unexpected os-release output.';
                  }
                  out.FIRMWARE_VERSION = out.BUILD_ID || out.COMMIT_ID || out.VERSION_ID || null;
                  return JSON.stringify(out);
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/info.cgi'
          query_fields:
            - name: name
              value: release
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: 24a0faf6f0a24b5c92aef3e1fb0de694
          name: 'Get device info'
          type: HTTP_AGENT
          key: thingino.device.get
          delay: 1h
          history: '0'
          value_type: TEXT
          description: 'Device identity from the Thingino camera agent (`/api/v1/device`): camera ID and hostname.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/agent.cgi'
          query_fields:
            - name: agent_path
              value: /api/v1/device
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: b5860cf79ed6462592056bac34c2f108
          name: 'Get sensor info'
          type: HTTP_AGENT
          key: thingino.sensor.get
          delay: 1h
          history: '0'
          value_type: TEXT
          description: 'Image sensor and SoC model from `/x/json-sensor-info.cgi`.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/json-sensor-info.cgi'
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: 158fef95d2d04f61858b085d37268d19
          name: 'Get streamer state'
          type: HTTP_AGENT
          key: thingino.streamer.get
          delay: '{$THINGINO.INTERVAL}'
          history: '0'
          value_type: TEXT
          description: 'Read-only query of the prudynt streamer JSON API (`/x/json-prudynt.cgi`): stream settings, live stream statistics, MP4 recorder state and motion detection. All values in the request are null, so nothing is changed. Cameras with the raptor or timps streamer do not have this endpoint.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          timeout: 15s
          url: '{$THINGINO.SCHEME}://{HOST.CONN}:{$THINGINO.PORT}/x/json-prudynt.cgi'
          headers:
            - name: X-API-Key
              value: '{$THINGINO.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
          posts: '{"stream0":{"enabled":null,"audio_enabled":null,"rtsp_endpoint":null,"format":null,"mode":null,"fps":null,"width":null,"height":null,"bitrate":null,"stats":null},"stream1":{"enabled":null,"audio_enabled":null,"rtsp_endpoint":null,"format":null,"mode":null,"fps":null,"width":null,"height":null,"bitrate":null,"stats":null},"motion":{"enabled":null},"mp4":{"status":null}}'
          post_type: JSON
          request_method: POST
        - uuid: c8649727ffa649608d36fc7c298f6244
          name: 'API: Status'
          type: DEPENDENT
          key: thingino.api.status
          description: 'Result of the last runtime data request: 0 - camera unreachable, 1 - OK, 2 - authentication failed, 3 - camera agent error, 4 - unexpected response, 5 - agent.cgi sends a malformed HTTP status line (firmware without the 2026-08-16 fix, including the ciao release branch).'
          valuemap:
            name: 'Thingino API status'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = String(value);
                  if (text.indexOf('ZBX_ERROR:') === 0) {
                      // agent.cgi without the upstream fix sends "HTTP/1.1 200 OK\r\r\n", which libcurl rejects.
                      return /carriage return found in header/i.test(text) ? 5 : 0;
                  }
                  var data;
                  try {
                      data = JSON.parse(text);
                  }
                  catch (e) {
                      return 4;
                  }
                  if (data === null || typeof data !== 'object') {
                      return 4;
                  }
                  if (typeof data.error !== 'undefined') {
                      var message = (typeof data.error === 'string') ? data.error : JSON.stringify(data.error);
                      return /authentication required/i.test(message) ? 2 : 3;
                  }
                  return (typeof data.system === 'object' && data.system !== null) ? 1 : 4;
          master_item:
            key: thingino.runtime.get
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 985b542c602d4bf48bc553f77e2f9922
              expression: 'max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=0'
              name: 'Thingino: Camera is unreachable'
              event_name: 'Thingino: Camera is unreachable (for {$THINGINO.UNAVAILABLE.PERIOD})'
              priority: AVERAGE
              description: 'The camera web server has not answered for {$THINGINO.UNAVAILABLE.PERIOD}. The camera may be powered off, offline or overloaded. The item "API: Error message" contains the last transport error.'
              tags:
                - tag: scope
                  value: availability
            - uuid: b029b194138b4f32be0f3d3ad52bd6f6
              expression: 'last(/Thingino camera by HTTP/thingino.api.status)=2'
              name: 'Thingino: API authentication failed'
              priority: AVERAGE
              description: 'The camera rejected the request with "401 Authentication required". Generate an API key on the camera (Settings > Web Interface > API Access) and put it into the {$THINGINO.API.KEY} macro, or add the Zabbix server/proxy address to "Trusted IPs (skip login)" on the same page.'
              manual_close: 'YES'
              dependencies:
                - name: 'Thingino: Camera is unreachable'
                  expression: 'max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=0'
              tags:
                - tag: scope
                  value: availability
            - uuid: 63f2d9fe411745f08b81a75881f09f4c
              expression: 'min(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=3 and max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=3'
              name: 'Thingino: Camera agent is not responding'
              priority: AVERAGE
              description: 'The web server answers, but the Thingino camera agent (agentd, port 1998 on the camera) returns errors for {$THINGINO.UNAVAILABLE.PERIOD}. Check "/etc/init.d/S95agent status" on the camera.'
              manual_close: 'YES'
              dependencies:
                - name: 'Thingino: Camera is unreachable'
                  expression: 'max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=0'
              tags:
                - tag: scope
                  value: availability
            - uuid: 37c9c09797074d05856fac5f5a7b36a0
              expression: 'last(/Thingino camera by HTTP/thingino.api.status)=4'
              name: 'Thingino: Unexpected API response'
              priority: WARNING
              description: 'The camera returned a response that is not Thingino agent JSON. The firmware may be too old (no camera agent) or another device answers on {HOST.CONN}:{$THINGINO.PORT}. See the "API: Error message" item.'
              manual_close: 'YES'
              dependencies:
                - name: 'Thingino: Camera is unreachable'
                  expression: 'max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=0'
              tags:
                - tag: scope
                  value: availability
            - uuid: 31c372496fdc4cc3965d52ead9026af9
              expression: 'last(/Thingino camera by HTTP/thingino.api.status)=5'
              name: 'Thingino: Camera agent API unavailable (agent.cgi header bug)'
              priority: INFO
              description: 'The camera answers /x/agent.cgi requests with "HTTP/1.1 200 OK\r\r\n" (an extra carriage return). libcurl, used by Zabbix, rejects it with "Carriage return found in header"; browsers ignore it, so the web UI still works. The bug was fixed in Thingino master on 2026-08-16 (commit ff589846), but the "ciao" release branch (e.g. firmware-2026-11-05) still has it. Everything that has another source is collected anyway; only these items stay empty: stream health and RTSP listener, storage mount state, recording autostart, motion detected, network, day/night target mode, pending upgrade, hostname and camera ID. Fix (over SSH on the camera): sed -i ''s|text="Bad Gateway"; printf|text="Bad Gateway"; sub(/\\r$/, "", text); printf|'' /var/www/x/agent.cgi - the change is stored in the overlay and survives reboots. After installing a firmware that contains the fix, restore the stock file with: cp /rom/var/www/x/agent.cgi /var/www/x/agent.cgi'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 7952c48a18c342a4adb5ade710dfcddb
          name: 'API: Error message'
          type: DEPENDENT
          key: thingino.api.error
          value_type: CHAR
          description: 'Transport or API error of the last runtime data request, "OK" when the request succeeded.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = String(value);
                  if (text.indexOf('ZBX_ERROR:') === 0) {
                      return text.substring(10).trim() || 'Unknown error';
                  }
                  var data;
                  try {
                      data = JSON.parse(text);
                  }
                  catch (e) {
                      return ('Unexpected response: ' + text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim()).substring(0, 250);
                  }
                  if (data !== null && typeof data === 'object') {
                      if (typeof data.error === 'string') {
                          return data.error.substring(0, 250);
                      }
                      if (data.error && data.error.message) {
                          return String(data.error.message).substring(0, 250);
                      }
                      if (typeof data.error !== 'undefined') {
                          return JSON.stringify(data.error).substring(0, 250);
                      }
                      if (typeof data.system === 'object' && data.system !== null) {
                          return 'OK';
                      }
                  }
                  return ('Unexpected response: ' + text).substring(0, 250);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: thingino.runtime.get
          tags:
            - tag: component
              value: health
