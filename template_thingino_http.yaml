        - uuid: 3bbfc4cdaf964a85938686c26dfb985a
          name: 'Memory: Available'
          type: DEPENDENT
          key: thingino.memory.available
          units: B
          description: 'Free memory plus buffers and page cache.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.memory
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = JSON.parse(value);
                  if (!m.total || typeof m.free !== 'number') {
                      return 'null';
                  }
                  // Same fallback the camera agent uses when MemAvailable is missing (kernel 3.10 on T10/T20/T30).
                  var available = m.free + (m.buffers || 0) + (m.cached || 0);
                  return available * 1024;
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: thingino.usage.get
          tags:
            - tag: component
              value: memory
        - uuid: cb6c442f2d034f6d996ad67dad7533ae
          name: 'Memory: Used'
          type: DEPENDENT
          key: thingino.memory.used
          units: B
          description: 'Used memory (total minus available).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.memory
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = JSON.parse(value);
                  if (!m.total || typeof m.free !== 'number') {
                      return 'null';
                  }
                  // Same fallback the camera agent uses when MemAvailable is missing (kernel 3.10 on T10/T20/T30).
                  var available = m.free + (m.buffers || 0) + (m.cached || 0);
                  return Math.max(m.total - available, 0) * 1024;
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: thingino.usage.get
          tags:
            - tag: component
              value: memory
        - uuid: 78f96f1f57fb43648f75666fc5073141
          name: 'Memory: Utilization'
          type: DEPENDENT
          key: thingino.memory.pused
          value_type: FLOAT
          units: '%'
          description: 'Used memory in percent of total.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.memory
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = JSON.parse(value);
                  if (!m.total || typeof m.free !== 'number') {
                      return 'null';
                  }
                  // Same fallback the camera agent uses when MemAvailable is missing (kernel 3.10 on T10/T20/T30).
                  var available = m.free + (m.buffers || 0) + (m.cached || 0);
                  return (Math.max(m.total - available, 0) / m.total * 100).toFixed(2);
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
