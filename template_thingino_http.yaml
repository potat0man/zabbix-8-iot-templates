                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: 0e0b74ee8a9a4c32aaf5efcc596caef6
              name: 'Stream [{#STREAM.ID}]: Resolution'
              type: DEPENDENT
              key: 'thingino.stream.resolution[{#STREAM.ID}]'
              value_type: CHAR
              description: 'Configured video resolution (width x height).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = JSON.parse(value);
                      if (!s.width || !s.height) {
                          return 'null';
                      }
                      return s.width + 'x' + s.height;
                - type: NOT_MATCHES_REGEX
                  parameters:
                    - '^(null)?$'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: 8f018f9864f1482797f47127b32cd775
              name: 'Stream [{#STREAM.ID}]: Configured frame rate'
              type: DEPENDENT
              key: 'thingino.stream.fps[{#STREAM.ID}]'
              units: fps
              description: 'Configured frame rate.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}.fps'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: 6b57621d3444456c8637db15604aea14
              name: 'Stream [{#STREAM.ID}]: Configured bitrate'
              type: DEPENDENT
              key: 'thingino.stream.bitrate[{#STREAM.ID}]'
              units: bps
              description: 'Configured target bitrate (kbps in the camera settings).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}.bitrate'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: ddc1ad596e344e168a69c34903d95cc9
              name: 'Stream [{#STREAM.ID}]: Live frame rate'
              type: DEPENDENT
              key: 'thingino.stream.livefps[{#STREAM.ID}]'
              units: fps
              description: 'Frames per second the encoder produced in the last second. prudynt idles an encoder that nobody consumes (no RTSP client, no recording), so 0 is normal when the stream is not watched.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}.stats.fps'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: a3eeb6a7a3c441ecb737297a0a20380b
              name: 'Stream [{#STREAM.ID}]: Live bitrate'
              type: DEPENDENT
              key: 'thingino.stream.livebps[{#STREAM.ID}]'
              units: bps
              description: 'Bitrate the encoder produced in the last second (0 when the stream is idle).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}.stats.Bps'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: 44337651a4b2441aa13590c404a7bfe5
              name: 'Stream [{#STREAM.ID}]: Codec'
              type: DEPENDENT
              key: 'thingino.stream.codec[{#STREAM.ID}]'
              value_type: CHAR
              description: 'Video codec: H264 or H265.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}.format'
                  error_handler: DISCARD_VALUE
                - type: NOT_MATCHES_REGEX
                  parameters:
                    - '^(null)?$'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: f6c084f52e0b4f0c8a3744991340dfbc
              name: 'Stream [{#STREAM.ID}]: Rate control'
              type: DEPENDENT
              key: 'thingino.stream.mode[{#STREAM.ID}]'
              value_type: CHAR
              description: 'Encoder rate control mode (CBR, VBR, SMART, FIXQP, ...).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}.mode'
                  error_handler: DISCARD_VALUE
                - type: NOT_MATCHES_REGEX
                  parameters:
                    - '^(null)?$'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
          trigger_prototypes:
            - uuid: d03aba88b9564025aedb42dde0a0b61b
              expression: 'last(/Thingino camera by HTTP/thingino.stream.enabled[{#STREAM.ID}])=1 and max(/Thingino camera by HTTP/thingino.stream.healthy[{#STREAM.ID}],{$THINGINO.STREAM.UNHEALTHY.PERIOD})=0'
              name: 'Thingino: Stream [{#STREAM.ID}] is unhealthy'
              event_name: 'Thingino: Stream [{#STREAM.ID}] is unhealthy (for {$THINGINO.STREAM.UNHEALTHY.PERIOD})'
              priority: AVERAGE
              description: 'Stream {#STREAM.ID} ("{#STREAM.ENDPOINT}") is enabled, but its video is disabled or the RTSP listener is down.'
              manual_close: 'YES'
              dependencies:
                - name: 'Thingino: Streamer is not running'
                  expression: 'max(/Thingino camera by HTTP/thingino.streamer.running,{$THINGINO.STREAMER.DOWN.PERIOD})=0'
                - name: 'Thingino: Camera is unreachable'
                  expression: 'max(/Thingino camera by HTTP/thingino.api.status,{$THINGINO.UNAVAILABLE.PERIOD})=0'
              tags:
                - tag: scope
                  value: availability
          graph_prototypes:
            - uuid: 5ccbcd69c99349c1b3e1b74981bef519
              name: 'Thingino: Stream [{#STREAM.ID}]: Bitrate'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Thingino camera by HTTP'
                    key: 'thingino.stream.livebps[{#STREAM.ID}]'
                - sortorder: '1'
                  drawtype: DASHED_LINE
                  color: F63100
                  item:
                    host: 'Thingino camera by HTTP'
                    key: 'thingino.stream.bitrate[{#STREAM.ID}]'
          master_item:
            key: thingino.streamer.get
          lld_macro_paths:
            - lld_macro: '{#STREAM.ENDPOINT}'
              path: $.endpoint
            - lld_macro: '{#STREAM.ID}'
              path: $.id
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data;
                  try {
                      data = JSON.parse(value);
                  }
                  catch (e) {
                      return 'SKIP';
                  }
                  if (data === null || typeof data !== 'object') {
                      return 'SKIP';
                  }
                  var out = [];
                  for (var i = 0; i < 2; i++) {
                      var st = data['stream' + i];
                      if (st === null || typeof st !== 'object') {
                          continue;
                      }
                      out.push({id: i, endpoint: st.rtsp_endpoint ? String(st.rtsp_endpoint) : 'unknown'});
                  }
                  return out.length ? JSON.stringify(out) : 'SKIP';
            - type: NOT_MATCHES_REGEX
              parameters:
                - ^SKIP$
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: a2ca52ce8666437f95ad4b7a7cf5239b
          name: 'Filesystem discovery'
          type: DEPENDENT
          key: thingino.vfs.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSNAME}'
                value: '{$THINGINO.VFS.FS.NAME.MATCHES}'
              - macro: '{#FSNAME}'
                value: '{$THINGINO.VFS.FS.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#FSTYPE}'
                value: '{$THINGINO.VFS.FS.TYPE.MATCHES}'
              - macro: '{#FSTYPE}'
                value: '{$THINGINO.VFS.FS.TYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovers mounted data filesystems (SD card, USB storage, NFS/SMB shares) from `df -T`. The overlay flash partition is monitored by the "Overlay:" items.'
          item_prototypes:
            - uuid: e3d7825bdc84498d8f3ee10aa737c88a
              name: 'Filesystem [{#FSNAME}]: Total space'
              type: DEPENDENT
              key: 'thingino.vfs.size["{#FSNAME}",total]'
              units: B
              description: 'Total space of {#FSNAME} ({#FSTYPE}, {#FSDEVICE}).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.filesystems[?(@.mount == "{#FSNAME}")].total.first()'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: thingino.status.get
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
            - uuid: 92c665b7185d498e9c710f8f3224168c
              name: 'Filesystem [{#FSNAME}]: Used space'
              type: DEPENDENT
              key: 'thingino.vfs.size["{#FSNAME}",used]'
              units: B
              description: 'Used space of {#FSNAME} ({#FSTYPE}, {#FSDEVICE}).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.filesystems[?(@.mount == "{#FSNAME}")].used.first()'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: thingino.status.get
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
            - uuid: 86d7dc61175844c1acc81421b6d25a85
              name: 'Filesystem [{#FSNAME}]: Free space'
              type: DEPENDENT
              key: 'thingino.vfs.size["{#FSNAME}",free]'
              units: B
              description: 'Free space of {#FSNAME} ({#FSTYPE}, {#FSDEVICE}).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.filesystems[?(@.mount == "{#FSNAME}")].free.first()'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: thingino.status.get
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
            - uuid: 267a9b3fd68c4ff68940f5049acf59e0
              name: 'Filesystem [{#FSNAME}]: Space utilization'
              type: DEPENDENT
              key: 'thingino.vfs.size["{#FSNAME}",pused]'
              value_type: FLOAT
              units: '%'
              description: 'Used space of {#FSNAME} in percent (as reported by df).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.filesystems[?(@.mount == "{#FSNAME}")].first()'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var f = JSON.parse(value);
                      if (!f.total || (f.used + f.free) <= 0) {
                          return 'null';
                      }
                      return (f.used / (f.used + f.free) * 100).toFixed(2);
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: thingino.status.get
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
          trigger_prototypes:
            - uuid: 7026572034f74180af17b276507254c9
              expression: 'last(/Thingino camera by HTTP/thingino.vfs.size["{#FSNAME}",free])<{$THINGINO.STORAGE.FREE.MIN:"{#FSNAME}"}'
              name: 'Thingino: Filesystem [{#FSNAME}]: Free space is low'
              event_name: 'Thingino: Filesystem [{#FSNAME}]: Free space is low (less than {$THINGINO.STORAGE.FREE.MIN:"{#FSNAME}"})'
              opdata: 'Free: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Free space on {#FSNAME} is below {$THINGINO.STORAGE.FREE.MIN:"{#FSNAME}"}. The Thingino record manager normally deletes the oldest recordings to keep 500 MB free on the recording storage, so this usually means the cleanup is not working or the card holds other data.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: capacity
          graph_prototypes:
            - uuid: c558979ffd1945afb8e4b6909d25aa66
              name: 'Thingino: Filesystem [{#FSNAME}]: Space usage'
              type: STACKED
              graph_items:
                - color: F63100
                  item:
                    host: 'Thingino camera by HTTP'
                    key: 'thingino.vfs.size["{#FSNAME}",used]'
                - sortorder: '1'
                  color: 199C0D
                  item:
                    host: 'Thingino camera by HTTP'
                    key: 'thingino.vfs.size["{#FSNAME}",free]'
          master_item:
            key: thingino.status.get
          lld_macro_paths:
            - lld_macro: '{#FSDEVICE}'
              path: $.device
            - lld_macro: '{#FSNAME}'
              path: $.mount
            - lld_macro: '{#FSTYPE}'
              path: $.type
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.filesystems
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var fs = JSON.parse(value);
                  var out = [];
                  for (var i = 0; i < fs.length; i++) {
                      out.push({mount: fs[i].mount, type: fs[i].type, device: fs[i].device});
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: hardware
        - tag: subclass
          value: camera
        - tag: target
          value: cctv
        - tag: target
          value: thingino
      macros:
        - macro: '{$THINGINO.API.KEY}'
          type: SECRET_TEXT
          description: 'Camera API key (Settings > Web Interface > API Access > Generate). Sent in the X-API-Key header. Can stay empty if the Zabbix server/proxy address is in "Trusted IPs (skip login)" on the same page.'
          config:
            type: TEXT
            priority: '4'
            label: 'API key'
            description: 'API key generated on the camera in *Settings > Web Interface > API Access*. Leave empty only if the Zabbix server or proxy IP is in "Trusted IPs (skip login)" on the same page.'
        - macro: '{$THINGINO.INTERVAL}'
          value: 1m
          description: 'Polling interval of the runtime and heartbeat data.'
          config:
            type: TEXT
            priority: '5'
            label: 'Polling interval'
            description: 'Update interval of the main data requests, e.g. 1m. Increase it to reduce the load on slow cameras.'
            required: 'YES'
            regex: '^[0-9]+[smhdw]?$'
        - macro: '{$THINGINO.LLD.FILTER.STREAM.MATCHES}'
          value: '.*'
          description: 'Filter of discoverable streams by ID.'
          config:
            type: TEXT
            priority: '15'
            section_name: Discovery
            label: 'Streams to include'
            description: 'Regular expression for stream IDs (0 - main stream, 1 - substream).'
        - macro: '{$THINGINO.LLD.FILTER.STREAM.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Filter to exclude discovered streams by ID.'
          config:
            type: TEXT
            priority: '16'
            section_name: Discovery
            label: 'Streams to exclude'
            description: 'Regular expression for stream IDs to exclude.'
        - macro: '{$THINGINO.LOAD.AVG.MAX}'
          value: '8'
          description: 'Maximum 5-minute load average.'
          config:
            type: TEXT
            priority: '11'
            section_name: Thresholds
            label: 'Maximum load average'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$THINGINO.MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Maximum memory utilization in %.'
          config:
            type: TEXT
            priority: '10'
            section_name: Thresholds
            label: 'Maximum memory utilization, %'
            description: 'In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$THINGINO.NODATA.TIMEOUT}'
          value: 30m
          description: 'Period without runtime data for the "No data received" trigger.'
          config:
            type: TEXT
            priority: '7'
            section_name: Thresholds
            label: 'No data timeout'
            regex: '^[0-9]+[smhdw]?$'
        - macro: '{$THINGINO.OVERLAY.PUSED.MAX.CRIT}'
          value: '95'
          description: 'Critical overlay utilization in %.'
          config:
            type: TEXT
            priority: '13'
            section_name: Thresholds
            label: 'Overlay utilization, critical %'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$THINGINO.OVERLAY.PUSED.MAX.WARN}'
          value: '85'
          description: 'Warning overlay utilization in %.'
          config:
            type: TEXT
            priority: '12'
            section_name: Thresholds
            label: 'Overlay utilization, warning %'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$THINGINO.PORT}'
          value: '443'
          description: 'Port of the camera web interface (443 for HTTPS, 80 for plain HTTP).'
          config:
            type: TEXT
            priority: '3'
            label: Port
            description: 'Web interface port. In the range from 1 to 65535 inclusive.'
            required: 'YES'
            regex: '^[0-9]{1,5}$'
        - macro: '{$THINGINO.RECORDING.INACTIVE.PERIOD}'
          value: 10m
          description: 'Period without an active recording (while autostart is on) before a problem is raised.'
          config:
            type: TEXT
            priority: '17'
            section_name: Thresholds
            label: 'Recording inactivity period'
            regex: '^[0-9]+[smhdw]?$'
        - macro: '{$THINGINO.SCHEME}'
          value: https
          description: 'Scheme of the camera web interface: https (default uhttpd build) or http.'
          config:
            type: LIST
            priority: '2'
            label: Scheme
            required: 'YES'
            description: 'The default Thingino web server (uhttpd) serves HTTPS on port 443 and redirects HTTP to HTTPS. Certificates are not verified, so the self-signed camera certificate is accepted.'
            options:
              - value: http
                text: HTTP
              - value: https
                text: HTTPS
        - macro: '{$THINGINO.STORAGE.FREE.MIN}'
          value: 256M
          description: 'Minimum free space on a discovered filesystem. Use a context macro for one mount point, e.g. {$THINGINO.STORAGE.FREE.MIN:"/mnt/nfs"}.'
          config:
            type: TEXT
            priority: '14'
            section_name: Thresholds
            label: 'Minimum free storage space'
            description: 'Size with an optional suffix (K, M, G), e.g. 256M.'
            regex: '^[0-9]+[KMGT]?$'
        - macro: '{$THINGINO.STREAM.UNHEALTHY.PERIOD}'
          value: 5m
          description: 'Period a stream must be unhealthy to raise a problem.'
          config:
            type: TEXT
            priority: '9'
            section_name: Thresholds
            label: 'Stream unhealthy period'
            regex: '^[0-9]+[smhdw]?$'
        - macro: '{$THINGINO.STREAMER.DOWN.PERIOD}'
          value: 3m
          description: 'Period the streamer must be down to raise a problem.'
          config:
            type: TEXT
            priority: '8'
            section_name: Thresholds
            label: 'Streamer down period'
            regex: '^[0-9]+[smhdw]?$'
        - macro: '{$THINGINO.TIME.DIFF.MAX}'
          value: 2m
          description: 'Maximum allowed camera clock difference from the Zabbix server.'
          config:
            type: TEXT
            priority: '18'
            section_name: Thresholds
            label: 'Maximum clock difference'
            regex: '^[0-9]+[smhdw]?$'
        - macro: '{$THINGINO.UNAVAILABLE.PERIOD}'
          value: 3m
          description: 'Period of failed requests before the camera is unreachable.'
          config:
            type: TEXT
            priority: '6'
            section_name: Thresholds
            label: 'Unreachable period'
            regex: '^[0-9]+[smhdw]?$'
        - macro: '{$THINGINO.VFS.FS.NAME.MATCHES}'
          value: '.*'
          description: 'Mount points to discover (regular expression).'
          config:
            type: TEXT
            priority: '19'
            section_name: Discovery
            label: 'Mount points to include'
        - macro: '{$THINGINO.VFS.FS.NAME.NOT_MATCHES}'
          value: ^(/dev|/sys|/proc|/run|/tmp|/overlay|/rom)($|/)
          description: 'Mount points to skip (regular expression).'
          config:
            type: TEXT
            priority: '20'
            section_name: Discovery
            label: 'Mount points to exclude'
        - macro: '{$THINGINO.VFS.FS.TYPE.MATCHES}'
          value: '^(vfat|msdos|exfat|ext[234]|f2fs|btrfs|xfs|ntfs3?|fuseblk|nfs4?|cifs|smb3)$'
          description: 'Filesystem types to discover (regular expression).'
          config:
            type: TEXT
            priority: '21'
            section_name: Discovery
            label: 'Filesystem types to include'
        - macro: '{$THINGINO.VFS.FS.TYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Filesystem types to skip (regular expression).'
          config:
            type: TEXT
            priority: '22'
            section_name: Discovery
            label: 'Filesystem types to exclude'
      dashboards:
