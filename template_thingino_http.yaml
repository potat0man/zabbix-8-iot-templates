        - uuid: 3f4bae84c9674507a67b30f140490b26
          name: 'Recording: Active'
          type: DEPENDENT
          key: thingino.recording.active
          description: 'A recording is in progress.'
          valuemap:
            name: 'Thingino yes/no'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var h;
                  try {
                      h = JSON.parse(value);
                  }
                  catch (e) {
                      return 'null';
                  }
                  if (h === null || typeof h !== 'object') {
                      return 'null';
                  }
                  function on(v) {
                      return v === true || v === 1 || v === '1' || v === 'true';
                  }
                  if (typeof h.rec_ch0 === 'undefined' && typeof h.rec_ch1 === 'undefined') {
                      return 'null';
                  }
                  return (on(h.rec_ch0) || on(h.rec_ch1)) ? 1 : 0;
            - type: MATCHES_REGEX
              parameters:
                - '^[01]$'
              error_handler: DISCARD_VALUE
          master_item:
            key: thingino.heartbeat.get
          tags:
            - tag: component
              value: recording
      discovery_rules:
        - uuid: 66b26a5eb841433d9b028854532cf6cb
          name: 'Video stream discovery'
          type: DEPENDENT
          key: thingino.stream.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#STREAM.ID}'
                value: '{$THINGINO.LLD.FILTER.STREAM.MATCHES}'
              - macro: '{#STREAM.ID}'
                value: '{$THINGINO.LLD.FILTER.STREAM.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovers the main (0) and substream (1) video encoders of the prudynt streamer. Settings, live statistics and recording state come from /x/json-prudynt.cgi; health and RTSP listener state come from the camera agent. Cameras with the raptor or timps streamer have no streams discovered.'
          item_prototypes:
            - uuid: 7e3098fa66b94283a41ba0145c6c690c
              name: 'Stream [{#STREAM.ID}]: Enabled'
              type: DEPENDENT
              key: 'thingino.stream.enabled[{#STREAM.ID}]'
              description: 'Stream {#STREAM.ID} (RTSP endpoint "{#STREAM.ENDPOINT}") is enabled.'
              valuemap:
                name: 'Thingino yes/no'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}.enabled'
                  error_handler: DISCARD_VALUE
                - type: BOOL_TO_DECIMAL
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: 0760288ae94646fd98e6b7ff6ed5fbee
              name: 'Stream [{#STREAM.ID}]: Healthy'
              type: DEPENDENT
              key: 'thingino.stream.healthy[{#STREAM.ID}]'
              description: 'The streamer is running, the stream and its video are enabled and the RTSP listener is up. Reported by the camera agent (needs a working /x/agent.cgi).'
              valuemap:
                name: 'Thingino health'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.streams[?(@.id == {#STREAM.ID})].healthy.first()'
                  error_handler: DISCARD_VALUE
                - type: BOOL_TO_DECIMAL
                  error_handler: DISCARD_VALUE
              master_item:
                key: thingino.runtime.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: 1e68c164ba574c8c88e58d4f5d998af2
              name: 'Stream [{#STREAM.ID}]: RTSP listener'
              type: DEPENDENT
              key: 'thingino.stream.rtsp[{#STREAM.ID}]'
              description: 'The RTSP server port is listening. Reported by the camera agent (needs a working /x/agent.cgi).'
              valuemap:
                name: 'Thingino up/down'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.streams[?(@.id == {#STREAM.ID})].rtsp_listener_up.first()'
                  error_handler: DISCARD_VALUE
                - type: BOOL_TO_DECIMAL
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: thingino.runtime.get
              tags:
                - tag: component
                  value: streaming
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: 6279ba5533e347749dcba3ca3ae8d7dc
              name: 'Stream [{#STREAM.ID}]: Recording'
              type: DEPENDENT
              key: 'thingino.stream.recording[{#STREAM.ID}]'
              description: 'The MP4 recorder of this stream is active.'
              valuemap:
                name: 'Thingino yes/no'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.mp4.status.ch{#STREAM.ID}'
                  error_handler: DISCARD_VALUE
                - type: BOOL_TO_DECIMAL
                  error_handler: DISCARD_VALUE
              master_item:
                key: thingino.streamer.get
              tags:
                - tag: component
                  value: recording
                - tag: stream
                  value: '{#STREAM.ID}'
            - uuid: daeaa6634dda482393f1cf2531401fdf
              name: 'Stream [{#STREAM.ID}]: Audio'
              type: DEPENDENT
              key: 'thingino.stream.audio[{#STREAM.ID}]'
              description: 'Audio is enabled in the stream.'
              valuemap:
                name: 'Thingino on/off'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.stream{#STREAM.ID}.audio_enabled'
                  error_handler: DISCARD_VALUE
                - type: BOOL_TO_DECIMAL
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: thingino.streamer.get
